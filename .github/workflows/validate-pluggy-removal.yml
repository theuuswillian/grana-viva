name: Validate Pluggy removal
on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["remocao/pluggy-definitiva-2026-11-18"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check plan rules
        run: node testes/planos.test.cjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock jsdom@24
      - name: Run application smoke tests
        run: node testes/smoke_jsdom.cjs
      - name: Check Pluggy removal invariants
        run: node scripts/validate-remocao-pluggy.mjs
