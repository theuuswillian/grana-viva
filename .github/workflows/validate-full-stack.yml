name: Validate full stack
on:
  push:
    branches:
      - revisao-lancamento-v10.165
      - correcoes/webhook-idempotencia-2026-11-18
      - correcoes/whatsapp-preservar-pendente-2026-11-18
      - correcoes/cota-mensal-atomica-2026-11-18
      - remocao/pluggy-definitiva-2026-11-18
      - auditoria/reconciliacao-producao-2026-11-18
      - auditoria/robustez-webhook-build-schema-2026-11-19
      - auditoria/reconciliacao-schema-parcial-2026-11-19
      - auditoria/whatsapp-fila-recuperavel-2026-11-19
      - correcoes/historico-cotas-cronologico-2026-11-19
  pull_request:
    branches:
      - revisao-lancamento-v10.165
      - correcoes/webhook-idempotencia-2026-11-18
      - correcoes/whatsapp-preservar-pendente-2026-11-18
      - correcoes/cota-mensal-atomica-2026-11-18
      - remocao/pluggy-definitiva-2026-11-18
      - auditoria/reconciliacao-producao-2026-11-18
      - auditoria/whatsapp-fila-recuperavel-2026-11-19
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: granaviva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d granaviva_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check app JavaScript
        run: node --check app.js
      - name: Check plan rules
        run: node testes/planos.test.cjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock jsdom@24
      - name: Run app smoke tests
        run: node testes/smoke_jsdom.cjs
      - name: Run Deno unit tests
        run: |
          deno test -A testes/*_test.ts
          if [ -f supabase/functions/minha-conta/pluggy_test.ts ]; then
            deno test -A supabase/functions/minha-conta/pluggy_test.ts
          fi
      - name: Test Pluggy cleanup migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f testes/pluggy_removal_fixture.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118_remocao_pluggy.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f testes/pluggy_removal_assertions.sql
      - name: Test atomic monthly quota migration and concurrency in PostgreSQL
        env:
          PGPASSWORD: postgres
          PGDATABASE: granaviva_cota_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          createdb -h 127.0.0.1 -U postgres granaviva_cota_test
          psql -h 127.0.0.1 -U postgres -d granaviva_cota_test -v ON_ERROR_STOP=1 -f testes/cota_mensal_atomica_fixture.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_cota_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118_cota_mensal_atomica.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_cota_test -v ON_ERROR_STOP=1 -f testes/cota_mensal_atomica_assertions.sql
          bash testes/cota_mensal_atomica_concurrency.sh
      - name: Test webhook idempotency and weekly summary migrations in PostgreSQL
        env:
          PGPASSWORD: postgres
          PGDATABASE: granaviva_webhooks_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          createdb -h 127.0.0.1 -U postgres granaviva_webhooks_test
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f testes/webhook_migrations_fixture.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115_webhooks_idempotencia.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115_wa_resumo_semanal.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115_webhooks_idempotencia.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115_wa_resumo_semanal.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -c "insert into public.wa_msg(id) values ('wamid-legacy-before-queue')"
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119_wa_fila_recuperavel.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f testes/webhook_migrations_assertions.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_webhooks_test -v ON_ERROR_STOP=1 -f testes/wa_fila_assertions.sql
      - name: Test production schema reconciliation in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
          PGDATABASE: granaviva_schema_reconcile_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          createdb -h 127.0.0.1 -U postgres granaviva_schema_reconcile_test
          psql -h 127.0.0.1 -U postgres -d granaviva_schema_reconcile_test -v ON_ERROR_STOP=1 -f testes/schema_reconciliacao_fixture.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_schema_reconcile_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118_z_reconciliar_schema_producao.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_schema_reconcile_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118_z_reconciliar_schema_producao.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_schema_reconcile_test -v ON_ERROR_STOP=1 -f testes/schema_reconciliacao_assertions.sql
      - name: Type-check all Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done
