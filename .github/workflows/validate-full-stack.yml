name: Validate full stack
on:
  push:
    branches:
      - revisao-lancamento-v10.165
      - correcoes/webhook-idempotencia-2026-11-18
      - correcoes/whatsapp-preservar-pendente-2026-11-18
      - correcoes/cota-mensal-atomica-2026-11-18
      - remocao/pluggy-definitiva-2026-11-18
      - correcoes/pagamento-lease-fencing-2026-11-19
      - correcoes/checkout-idempotencia-2026-11-19
  pull_request:
    branches:
      - revisao-lancamento-v10.165
      - correcoes/webhook-idempotencia-2026-11-18
      - correcoes/whatsapp-preservar-pendente-2026-11-18
      - correcoes/cota-mensal-atomica-2026-11-18
      - remocao/pluggy-definitiva-2026-11-18
      - correcoes/pagamento-lease-fencing-2026-11-19
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: granaviva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d granaviva_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check app JavaScript
        run: node --check app.js
      - name: Check plan rules
        run: node testes/planos.test.cjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock jsdom@24
      - name: Run app smoke tests
        run: node testes/smoke_jsdom.cjs
      - name: Run Deno unit tests
        run: |
          deno test -A testes/*_test.ts
          if [ -f supabase/functions/minha-conta/pluggy_test.ts ]; then
            deno test -A supabase/functions/minha-conta/pluggy_test.ts
          fi
      - name: Test payment webhook fencing migration and atomic application
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f testes/webhook_migrations_fixture.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115_webhooks_idempotencia.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119_pagamento_lease_fencing.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f testes/pagamento_lease_fencing_assertions.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119_pagamento_checkout_idempotencia.sql
          psql -h 127.0.0.1 -U postgres -d granaviva_test -v ON_ERROR_STOP=1 -f testes/pagamento_checkout_idempotencia_assertions.sql
      - name: Type-check all Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done
