/* cabeçalho do card de banco: nome + subtítulo sem sobreposição em tela estreita */
.bk > .row:first-child{flex-wrap:wrap;align-items:flex-start;row-gap:8px}
.bk-l{flex:1 1 180px;min-width:0}
.bk-l>div{min-width:0;flex:1 1 auto}
.bk-l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bk-l small{overflow-wrap:anywhere;display:block}
.bk > .row:first-child>.pill{flex-shrink:0;margin-left:auto}
/* estrela fora do fluxo do texto: coluna própria à direita, sem position absolute */
.bk{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:start}
.bk > .bk-star{position:static;grid-column:2;grid-row:1;margin:-4px -6px 0 0;top:auto;right:auto}
.bk > .row:not(.small){grid-column:1;grid-row:1;padding-right:0;min-width:0}
.bk > :not(.bk-star):not(.row:not(.small)){grid-column:1 / -1}
.bk-l{min-width:0;flex:1 1 0}
.bk-l b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .row{flex-wrap:wrap}

/* calendario do relatorio */
.filtros .mcal{grid-column:1/-1;min-width:0;width:100%;box-sizing:border-box;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}

.mcal-g>span:not(.mcal-w){aspect-ratio:1/1;display:grid;place-items:center;min-width:0;border-radius:50%;font-size:13px;color:var(--txt);font-variant-numeric:tabular-nums}

/* iPhone: respeita a área da barra de status e do indicador inferior (app instalado em tela cheia) */
/* --sat: área da barra de status. alguns iOS (26+) informam env()=0 mesmo desenhando a página por baixo dela; o script abaixo mede e aplica um mínimo */
:root{--sat:max(env(safe-area-inset-top,0px),var(--sat-fb,0px))}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:65;pointer-events:none}
#app{padding-top:calc(var(--sat) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.side{padding-top:calc(var(--sat) + 22px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#auth{padding-top:calc(var(--sat) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);right:max(18px,env(safe-area-inset-right,0px));transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s}
.fab.esc{transform:translateY(calc(100% + 40px)) scale(.7);opacity:0;pointer-events:none}
#app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 116px)!important}

/* ===== v10.65: acabamento premium =====
   regras de quem faz isso bem (Linear, Copilot Money, Revolut): números alinhados, cor só onde tem significado,
   menos gradiente, hierarquia por peso e tamanho, toque de 44px. */
body{font-variant-numeric:tabular-nums}
html:not(.claro){--txt-suave:rgba(255,255,255,.9)}
/* categoria: ícone ao lado do nome (antes o ícone ficava sozinho numa linha) */
.catName{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.catName .ic{flex:none;margin:0!important}
.catName b{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.card.orc>.row:first-child{gap:12px}
.card.orc .btn2{flex:none;min-height:36px;padding:0 14px;font-size:13px}
/* barras de orçamento: verde dentro do limite, âmbar perto, vermelho estourado (o gradiente não dizia nada) */
.card.orc .bar i,.hB .bar i,.bar:not(.mtBar):not(.ccHBar) i{background:var(--a1)}
.bar.warn i{background:#f59e0b!important}
.bar.over i{background:#ef4444!important}
/* nomes de lançamento sempre começam com maiúscula ("mercado" vira "Mercado"), sem mudar o dado salvo */
.tx .txt>b::first-letter{text-transform:uppercase}
/* valores grandes: tracking negativo, como em apps de banco */
.hmSaldo,.bk-val,.sumcard b,.mtSum b{letter-spacing:-.02em}
/* botões de ação principal sólidos (o gradiente verde-roxo competia com o saldo) */
.btn.full:not(.ghost){background:var(--a1);background-image:none}

/* ===== v10.66: segunda leva premium =====
   cartão de saldo sóbrio (grafite com brilho discreto da cor de destaque), um gradiente só (o do logo),
   botão + sólido, selo da fatura numa linha própria. */
.hB-hero{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--a1) 26%,transparent),transparent 58%),radial-gradient(90% 70% at 0% 100%,color-mix(in srgb,var(--a2) 16%,transparent),transparent 60%),linear-gradient(180deg,#1b1c21,#111216);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 48px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06)}
.hB-hero.hNeg{background:radial-gradient(120% 90% at 100% 0%,rgba(244,63,94,.28),transparent 58%),linear-gradient(180deg,#1f1416,#140d0f);border-color:rgba(244,63,94,.22);box-shadow:0 24px 48px -28px rgba(0,0,0,.85)}
.hB-hero .hB-blob,.hB-hero .hB-noise{display:none}
.hB-hero .hB-saldo{text-shadow:none}
.hB-hero .hB-sub,.hB-hero .hB-brand{color:rgba(255,255,255,.72)}
.hB-hero .hB-spark{color:var(--a1);opacity:1}
.hB-hero .hB-spark .spkDot{stroke:#111216;fill:var(--a1)}
.hB-hero .hB-strip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);backdrop-filter:none}
html.claro .hB-hero{box-shadow:0 22px 44px -26px rgba(15,23,42,.55)}
/* saudação: nome na cor de destaque, sem gradiente */
.hmHead h1 span{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--a1)}
/* botão +: sólido, sombra neutra */
.fab{background:var(--a1);box-shadow:0 10px 24px -8px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.12)}
/* fatura paga: selo e botões descem para uma linha própria e o nome não é mais espremido */
.tx:has(.fatAct){flex-wrap:wrap}
.tx .fatAct{order:7;flex-basis:100%;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;padding-left:48px;margin-top:-4px}
.tx .fatAct .badge{font-size:11px;padding:3px 8px}
.tx .fatAct,.tx .stLine{padding-left:58px}
/* gasto comum em cor neutra; vermelho fica para o que pede atenção (estouro, atraso). entradas seguem verdes */
.tx .val.neg{color:var(--txt)!important}
.tx .val.neg .sg{color:var(--mut)}
/* faísca do saldo e atalhos: cor de destaque discreta, sem degradê nem brilho */
.hB-hero{--sk1:var(--a1);--sk2:var(--a1)}
.hB-ai{color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:none}

   antes: travessão grande, "R$" pequeno no alto, centavos menores e fundo vermelho quando negativo.
   agora: um número só, sinal e "R$" em tom mais apagado na mesma linha, vermelho só no número. */

.hB-cur{font-size:1em;vertical-align:baseline;font-weight:600;opacity:1;color:rgba(255,255,255,.42);letter-spacing:-.02em}

.hB-hero .hB-neg{background:rgba(251,113,133,.14);color:#fda4af;font-weight:600;font-size:12px;padding:3px 9px;margin-right:8px}

/* ===== v10.66: alertas com arrastar ===== */
.alTools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 2px 12px;flex-wrap:wrap}
.alTools small{font-size:12px;color:var(--mut)}
.alTools .lnk{background:none;border:0;padding:6px 0;color:var(--a1);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.alQt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--a1) 18%,transparent);color:var(--a1);font-size:12px;font-weight:700;vertical-align:3px;margin-left:4px}
.alLista{display:flex;flex-direction:column;gap:8px}
.alItem{position:relative;border-radius:16px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:height .22s ease,margin .22s ease,opacity .22s ease}
.alItem.sai{opacity:0;margin-top:-8px}
.alBg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;color:#fff;background:var(--card2)}
.alBg span{display:flex;align-items:center;gap:7px;opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s}
.alBg .i{width:18px;height:18px}
.alItem.dir .alBg{background:#16a34a}.alItem.esq .alBg{background:#e11d48}
.alItem.dir .alL,.alItem.esq .alR{opacity:.85}
.alItem.pronto .alL,.alItem.pronto .alR{opacity:1;transform:scale(1)}
.alItem.lido.dir .alL b{font-size:0}.alItem.lido.dir .alL b::after{content:'não lida';font-size:13px}
.alFace{position:relative;display:flex;gap:10px;align-items:flex-start;padding:14px 14px 14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;will-change:transform}
.alItem.venc .alFace{border-color:rgba(244,63,94,.35)}
.alDot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--a1);margin-top:7px}
.alItem.venc .alDot{background:#f43f5e}
.alTxt{flex:1;min-width:0;font-size:14px;line-height:1.45;color:var(--txt)}
.alTxt .i{width:16px;height:16px;vertical-align:-3px;margin-right:4px;color:var(--mut)}
.alTxt .btn2.sm{margin:8px 6px 0 0}
.alItem.lido .alTxt{color:var(--mut)}
.alItem.lido .alFace{background:var(--card)}
.alItem.lido .alTxt b{font-weight:500}
.hB-hero.hNeg .hB-spark .spkDot{fill:#fb7185}
.alVazio{text-align:center;padding:28px 12px 18px;color:var(--mut)}
.alVazio .i{width:44px;height:44px;padding:10px;border-radius:50%;color:var(--a1);background:color-mix(in srgb,var(--a1) 15%,transparent);stroke-width:2.4}
.alVazio b{display:block;margin-top:12px;font-size:17px;color:var(--txt)}
.alVazio p{margin:6px 0 0;font-size:14px}
#toast.on:has(.tDesf){pointer-events:auto;z-index:300}
#toast .tDesf{margin-left:12px;background:none;border:0;color:var(--a1);font:inherit;font-weight:700;padding:4px 2px;cursor:pointer}

/* ===== v10.66b: saldo sem sinal de menos =====
   negativo é dito pelo rótulo ("Saldo negativo" com um ponto vermelho) e pela cor do número;
   "R$" pequeno na linha de base, número inteiro e centavos no mesmo tamanho. */
.hB-saldo{font-size:42px!important;font-weight:700;letter-spacing:-.04em;gap:.2em!important;font-variant-numeric:tabular-nums;line-height:1.05}
.hB-saldo .hB-cur{font-size:.42em!important;font-weight:600!important;letter-spacing:0!important;color:rgba(255,255,255,.5)!important;transform:translateY(-.08em)}
.hB-saldoNeg{color:#fda4af!important}
.hB-saldoNeg .hB-cur{color:rgba(253,164,175,.6)!important}
.hB-brandNeg{color:#fda4af!important}
.hB-led{width:8px;height:8px;border-radius:50%;background:#fb7185;box-shadow:0 0 0 4px rgba(251,113,133,.16);margin:0 4px 0 2px;display:inline-block;animation:hbLed 2.4s ease-in-out infinite}
@keyframes hbLed{50%{box-shadow:0 0 0 7px rgba(251,113,133,0)}}
@media (prefers-reduced-motion:reduce){.hB-led{animation:none}}
.hB-var{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:rgba(255,255,255,.88)}
.hB-var .i{width:14px;height:14px;stroke-width:2.2}

.hB-hero.hNeg{border-color:rgba(251,113,133,.22)!important}
.hB-red{color:#fda4af!important}

/* ===== v10.67: conta fixa sem borda dupla ===== */
.fixas-card{border:1px solid var(--line)!important;background:var(--card)!important}
.fixas-card::before{display:none!important}
.fx-ic{background:color-mix(in srgb,var(--a1) 16%,transparent)!important;color:var(--a1)!important;box-shadow:none!important}

.fx-ic.sm{background:var(--card2)!important;color:var(--mut)!important;border:1px solid var(--line)}

.fx-row.due{background:rgba(245,158,11,.07)!important;box-shadow:none!important;border:0!important;border-radius:12px;padding-left:10px}

/* ===== v10.67: barras semanais ===== */
.hB-sem{margin:12px 0 10px}
.hB-sem svg{display:block;width:100%;height:52px;overflow:visible}
.hB-sem .be{fill:#4ade80;opacity:.45}.hB-sem .bs{fill:#fb7185;opacity:.45}

/* ===== v10.67: primeiros passos ===== */
.pp-card{padding:16px!important}
.pp-h{display:flex;justify-content:space-between;align-items:flex-start}
.pp-h h4{margin:0 0 2px;font-size:16px}.pp-h small{color:var(--mut);font-size:12px}

.pp-t{flex:1;min-width:0}.pp-t b{display:block;font-size:14px;font-weight:600}.pp-t small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.pp-ch{width:16px;height:16px;color:var(--mut)}
.pp-i.ok{cursor:default}.pp-i.ok .pp-ic{background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1)}.pp-i.ok b{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
/* ===== v10.67: estados vazios ===== */
.card.vz{text-align:center;padding:28px 20px!important}
.vz-ic{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 14%,transparent);color:var(--a1)}

.vz-a{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* ===== v10.67: botões sólidos, sem degradê ===== */
.btn{background:var(--a1)!important;color:#08110b!important;box-shadow:none!important}

/* ===== v10.68: renda fixa ===== */
.rfDica{margin:-4px 0 12px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--mut)}

.liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:liveP 2s infinite}

.astFoot small .pos{color:#22c55e}.astFoot small .neg{color:#f87171}
.simCard{display:flex;flex-direction:column;gap:12px}

.simFolga{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.simFolga>div{min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.simFolga small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.simFolga b{display:block;font-size:18px;font-weight:700;color:var(--hd);margin-top:3px;overflow:hidden;white-space:nowrap}

.simDia{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--txt);cursor:pointer}
.simDia b{display:block;font-size:14px;color:var(--hd)}.simDia small{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.3}
.simTg{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.simTg i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.simDia.on .simTg{background:var(--a1)}.simDia.on .simTg i{transform:translateX(16px)}
.simLista{display:flex;flex-direction:column;gap:8px}
.simIt{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card2);border-left:3px solid #f87171}
.simIt.up{border-left-color:#22c55e}
.simItH{display:flex;align-items:center;gap:8px}.simItH b{flex:1;font-size:14px;color:var(--hd)}
.simItI{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--card);color:var(--mut)}.simItI svg{width:15px;height:15px}
.simX{width:32px;height:32px;display:grid;place-items:center;border:0;background:transparent;color:var(--mut);border-radius:10px;cursor:pointer}.simX svg{width:16px;height:16px}
.simItF{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:8px}

.simItF input,.simItF select{height:42px;min-height:42px;max-height:42px;font-size:16px;padding-inline:10px}

.simAdd{display:flex;flex-wrap:wrap;gap:6px}
.simAdd .chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer}
.simAdd .chip svg{width:14px;height:14px}
.simMais summary{font-size:13px;color:var(--mut);cursor:pointer}.simMais label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);margin-top:8px}
.simRes{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.simV{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px}
.simV svg{flex:none;width:20px;height:20px;margin-top:1px}.simV b{display:block;font-size:15px}.simV small{display:block;font-size:12.5px;margin-top:2px;opacity:.9;line-height:1.35}
.simV small b{display:inline;font-size:inherit}.simV.bom{background:rgba(34,197,94,.10);color:#22c55e}.simV.bom small{color:var(--txt)}
.simV.ruim{background:rgba(248,113,113,.10);color:#f87171}.simV.ruim small{color:var(--txt)}
.simCmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.simCmp small{display:block;font-size:11px;color:var(--mut);line-height:1.25}.simCmp b{display:block;font-size:14px;color:var(--hd);margin-top:3px;white-space:nowrap;overflow:hidden}
.simVazio{margin:0;color:var(--mut)}

.fxAtalho{display:flex;gap:6px;margin:-4px 0 6px}.fxAtalho .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer}
.fxAtalho .chip.on{background:var(--a1);border-color:var(--a1);color:#0b0c0f}
.fxDica{display:block;font-size:12.5px;color:var(--mut);margin:0 0 12px;line-height:1.35}.fxDica:empty{display:none}
/* v10.75: revisão de usabilidade */
.catList:not(.aberta):not(.busca) .crMais{display:none}
.catMaisBtn{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--a1);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}

@media (max-width:420px){.catRow .cr-n{font-size:12.5px;letter-spacing:-.015em}}
.pushTxt,#bcTxt.bcIntro{font-size:13.5px;line-height:1.45;color:var(--mut)}
.gvAtu{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9999;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:13.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);cursor:pointer;animation:rSobe .3s ease-out;white-space:nowrap}
.gvAtu .i{width:16px;height:16px;color:var(--a1)}.gvAtu b{color:var(--a1);font-weight:600}
/* v10.77: microfone estilo WhatsApp: barra própria abaixo do campo */
.iaCampo textarea{padding-right:12px;min-height:76px}
.iaCampo.gravando textarea{border-color:color-mix(in srgb,var(--a1) 70%,transparent)}
.iaVoz{position:relative;display:flex;align-items:center;gap:10px;margin-top:10px}
.iaPill{flex:1;min-width:0;height:52px;border-radius:26px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;overflow:hidden;transition:background .2s,border-color .2s}
.pIdle{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14.5px;white-space:nowrap}.pIdle .i{width:17px;height:17px;opacity:.8}
.pRec{display:none;align-items:center;gap:10px;width:100%;min-width:0}
.iaVoz.gravando .pIdle{display:none}.iaVoz.gravando .pRec{display:flex}
.iaVoz.gravando .iaPill{border-color:rgba(239,68,68,.35);background:color-mix(in srgb,var(--card2) 88%,#ef4444)}
.rDot{width:9px;height:9px;border-radius:50%;background:#ef4444;flex:none;animation:rPisca 1s infinite;box-shadow:0 0 0 4px rgba(239,68,68,.18)}
@keyframes rPisca{50%{opacity:.25}}
.rTempo{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--txt);flex:none;min-width:34px}
